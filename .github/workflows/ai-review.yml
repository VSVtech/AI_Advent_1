name: AI code review

# pull_request_target runs the workflow and the review script from the BASE
# branch, so the secret is never exposed to code from a pull request. The PR
# commits are only fetched as git objects and read as diff data: nothing from
# the PR is checked out, installed or executed.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  # Edits of the title or description get their own group, so they neither
  # cancel a running review nor start a new one (see the job condition).
  group: ai-review-${{ github.event.pull_request.number }}-${{ github.event.action == 'edited' && !github.event.changes.base && 'noop' || 'review' }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Spending the API key is limited to people with a role in the repository.
    # «edited» matters only when the base branch changed: the diff is different.
    if: >-
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) &&
      (github.event.action != 'edited' || github.event.changes.base)
    steps:
      # Default ref for pull_request_target is the base branch: trusted code.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch pull request commits as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"

      - name: Generate review
        # A failure is written into review.md and posted by the next step.
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REVIEW_BASE: origin/${{ github.base_ref }}
          HEAD_LABEL: ${{ github.head_ref }}
        run: node scripts/review/review-pr.mjs --head refs/remotes/pr/head --label="$HEAD_LABEL" --out review.md

      - name: Post review comment
        if: ${{ always() && hashFiles('review.md') != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const body = fs.readFileSync('review.md', 'utf8');
            const marker = '<!-- ai-code-review -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const previous = comments.find((c) => c.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
